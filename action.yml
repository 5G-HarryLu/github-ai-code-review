name: 'AI Code Review'
description: 'Claude reviews the pull request diff with no tools and no credentials; the action validates its findings and keeps one PR comment up to date.'
author: '5G-HarryLu'

inputs:
  claude-api-key:
    description: 'Anthropic API key.'
    required: true
  model:
    description: 'Claude model id.'
    required: false
    default: 'claude-opus-5-5'
  github-token:
    description: 'Token used to read the PR and write the comment. The job needs contents: read and pull-requests: write.'
    required: false
    default: ${{ github.token }}

outputs:
  comment-url:
    description: 'URL of the review comment.'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-circle'
  color: 'purple'
